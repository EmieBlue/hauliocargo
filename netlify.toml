# Netlify build settings.
#
# `output: "export"` in next.config.ts emits plain files into `out/`, so this is
# a pure static deploy — no Next.js runtime, no serverless functions. When a
# server feature arrives, that export setting comes out and this file needs
# revisiting alongside it.

[build]
  command = "npm run build"
  publish  = "out"

[build.environment]
  # Match the Node the project is developed against.
  NODE_VERSION = "22"

# Long-lived caching for fingerprinted build output. Safe because every one of
# these filenames changes when its contents change.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# These filenames, unlike /_next/static/*, do NOT change when their contents
# do — so real caching here means a swapped video/logo can stay stale in a
# visitor's browser until the window below elapses. Rename the file (e.g.
# haulio-bg-v2.mp4) to bust the cache immediately instead of waiting it out.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
